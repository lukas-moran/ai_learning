<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lukas 的 AI 学习目录，包含学习计划、数学基础、机器学习、大语言模型与 AI 伦理等知识模块。">
  <meta name="theme-color" content="#ffffff">
  <title>AI 学习笔记</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231f2328'/%3E%3Cpath d='M18 24l14-7 14 7-14 7-14-7zm0 9l14 7 14-7v8l-14 7-14-7v-8z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root {
      --text: #1f2328;
      --text-soft: #59636e;
      --text-muted: #7d8590;
      --line: #d8dee4;
      --line-dark: #afb8c1;
      --surface: #ffffff;
      --surface-soft: #f6f8fa;
      --surface-hover: #f3f4f6;
      --selected: #24292f;
      --focus: rgba(9, 105, 218, 0.25);
      --font-sans: "Inter", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    svg {
      display: block;
    }

    ::selection {
      background: #c8d9ea;
    }

    :focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: none;
      stroke-width: 1.8;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
    }

    .header-top {
      width: min(1360px, calc(100% - 48px));
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex: none;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .brand-mark .icon {
      width: 30px;
      height: 30px;
      stroke-width: 1.9;
    }

    .header-controls {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      flex: none;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text-soft);
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .icon-button:hover {
      border-color: var(--line);
      background: var(--surface-hover);
      color: var(--text);
    }

    .search-box {
      position: relative;
      width: min(360px, 34vw);
      margin: 0 8px;
    }

    .search-box .icon {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 21px;
      height: 21px;
      color: var(--text-soft);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 45px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: #eef1f4;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .search-box input::placeholder {
      color: #6f7781;
    }

    .search-box input:focus {
      border-color: var(--line-dark);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .github-link {
      height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      white-space: nowrap;
      transition: background 140ms ease;
    }

    .github-link:hover {
      background: var(--surface-hover);
    }

    .github-link .icon {
      width: 27px;
      height: 27px;
      stroke-width: 1.7;
    }

    .menu-panel {
      position: absolute;
      top: 48px;
      right: 80px;
      width: 260px;
      display: none;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      box-shadow: 0 12px 32px rgba(31, 35, 40, 0.12);
    }

    .menu-panel.is-open {
      display: block;
    }

    .menu-panel-label {
      padding: 8px 10px 6px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 10px;
      border-radius: 3px;
      color: var(--text-soft);
      font-size: 14px;
    }

    .menu-panel a:hover,
    .menu-panel a.is-active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .menu-panel a span {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .category-nav-wrap {
      width: min(1360px, calc(100% - 48px));
      margin: 0 auto;
    }

    .category-nav {
      display: flex;
      align-items: stretch;
      gap: 34px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .category-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: none;
      padding: 14px 0 15px;
      color: #4c5259;
      font-size: 14px;
      white-space: nowrap;
    }

    .category-link:hover {
      color: var(--text);
    }

    .category-link.is-active {
      color: var(--text);
      font-weight: 600;
    }

    .category-link.is-active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: var(--selected);
    }

    main {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 48px 0 88px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .breadcrumb a:hover {
      color: var(--text);
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      padding-bottom: 34px;
      border-bottom: 1px solid var(--line);
    }

    .page-head-main {
      max-width: 760px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 38px;
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    .page-description {
      margin-bottom: 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.8;
    }

    .page-meta {
      flex: none;
      padding-top: 7px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.7;
      text-align: right;
      white-space: nowrap;
    }

    .page-meta strong {
      display: block;
      color: var(--text-soft);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
    }

    .plan-progress {
      margin-top: 26px;
      padding: 18px 0 4px;
    }

    .progress-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 10px;
      color: var(--text-soft);
      font-size: 12px;
    }

    .progress-copy strong {
      color: var(--text);
      font-weight: 600;
    }

    .progress-track {
      height: 3px;
      overflow: hidden;
      background: #e5e9ed;
    }

    .progress-track span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--selected);
      transition: width 180ms ease;
    }

    .content-section {
      margin-top: 36px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      margin-bottom: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .section-heading span {
      color: var(--text-muted);
      font-size: 11px;
    }

    .outline-list {
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
      list-style: none;
    }

    .outline-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 68px;
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
    }

    .outline-row.is-link {
      transition: background 140ms ease;
    }

    .outline-row.is-link:hover {
      background: var(--surface-soft);
    }

    .outline-index {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .outline-main {
      min-width: 0;
    }

    .outline-title {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
      font-size: 15px;
      font-weight: 520;
      line-height: 1.5;
    }

    .outline-description {
      display: block;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .outline-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .outline-meta .icon {
      width: 15px;
      height: 15px;
      opacity: 0.7;
    }

    .plan-row {
      grid-template-columns: 22px 20px minmax(0, 1fr) auto;
      cursor: pointer;
    }

    .plan-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--selected);
      cursor: pointer;
    }

    .plan-row .outline-index {
      text-align: left;
    }

    .plan-row.is-complete .outline-title {
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .plan-row.is-complete .outline-description {
      opacity: 0.7;
    }

    .stage-row {
      grid-template-columns: 42px minmax(0, 1fr) auto;
    }

    .stage-row .outline-title {
      font-weight: 600;
    }

    .search-summary {
      margin: 28px 0 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    .search-result-category {
      display: inline-block;
      margin-right: 8px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
    }

    .search-result-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      min-height: 64px;
      padding: 10px 8px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      transition: background 140ms ease;
    }

    .search-result-row:hover {
      background: var(--surface-soft);
    }

    .search-result-row .icon {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
    }

    .empty-state {
      padding: 52px 0;
      border-bottom: 1px solid var(--line);
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text-soft);
      font-size: 15px;
      font-weight: 500;
    }

    .highlight-row {
      animation: highlight 1.6s ease;
    }

    @keyframes highlight {
      0%,
      35% {
        background: #fff8c5;
      }
      100% {
        background: transparent;
      }
    }

    .site-footer {
      border-top: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .footer-inner {
      width: min(1120px, calc(100% - 48px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .footer-inner a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    noscript {
      display: block;
      margin: 24px auto;
      padding: 12px 16px;
      border: 1px solid #d4a72c;
      background: #fff8c5;
      color: #4d2d00;
    }

    @media (max-width: 900px) {
      .header-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px 10px;
        padding: 12px 0;
      }

      .header-controls {
        display: contents;
      }

      .search-box {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        margin: 0;
      }

      .header-controls > .icon-button {
        grid-column: 2;
        grid-row: 1;
      }

      .github-link {
        grid-column: 3;
        grid-row: 1;
      }

      .menu-panel {
        top: calc(100% + 8px);
        right: 24px;
      }

      .category-nav {
        gap: 26px;
      }
    }

    @media (max-width: 640px) {
      .header-top,
      .category-nav-wrap,
      main,
      .footer-inner {
        width: min(100% - 32px, 1120px);
      }

      .header-top {
        padding: 10px 0 12px;
      }

      .brand {
        gap: 9px;
        font-size: 18px;
      }

      .brand-mark {
        width: 29px;
        height: 29px;
      }

      .brand-mark .icon {
        width: 26px;
        height: 26px;
      }

      .github-link {
        width: 38px;
        padding: 0;
        justify-content: center;
      }

      .github-link span {
        display: none;
      }

      .github-link .icon {
        width: 24px;
        height: 24px;
      }

      .menu-panel {
        top: calc(100% + 8px);
        right: 16px;
        left: 16px;
        width: auto;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
      }

      .category-nav {
        gap: 24px;
      }

      .category-link {
        padding-top: 11px;
        padding-bottom: 12px;
        font-size: 13px;
      }

      main {
        padding: 32px 0 64px;
      }

      .breadcrumb {
        margin-bottom: 13px;
      }

      .page-head {
        flex-direction: column;
        gap: 14px;
        padding-bottom: 26px;
      }

      h1 {
        font-size: 30px;
      }

      .page-description {
        font-size: 14px;
      }

      .page-meta {
        display: flex;
        gap: 10px;
        padding-top: 0;
        text-align: left;
        white-space: normal;
      }

      .page-meta strong {
        display: inline;
      }

      .content-section {
        margin-top: 30px;
      }

      .outline-row {
        grid-template-columns: 28px minmax(0, 1fr) auto;
        gap: 10px;
        min-height: 66px;
        padding-right: 2px;
        padding-left: 2px;
      }

      .plan-row {
        grid-template-columns: 20px 24px minmax(0, 1fr);
      }

      .plan-row .outline-meta {
        grid-column: 3;
        justify-self: start;
        margin-top: -8px;
        font-size: 10px;
      }

      .outline-description {
        white-space: normal;
      }

      .outline-meta {
        font-size: 10px;
      }

      .outline-meta .icon {
        display: none;
      }

      .footer-inner {
        min-height: 78px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        padding: 14px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <a class="brand" href="#plan" aria-label="AI 学习笔记首页">
        <span class="brand-mark" aria-hidden="true"><i data-lucide="library-big" class="icon"></i></span>
        <span>AI 学习笔记</span>
      </a>

      <div class="header-controls">
        <button class="icon-button" id="menuButton" type="button" aria-label="打开目录菜单" aria-expanded="false" aria-controls="menuPanel">
          <i data-lucide="menu" class="icon"></i>
        </button>

        <label class="search-box" for="searchInput">
          <i data-lucide="search" class="icon" aria-hidden="true"></i>
          <input id="searchInput" type="search" placeholder="搜索知识点" autocomplete="off" aria-label="搜索知识点">
        </label>

        <a class="github-link" href="https://github.com/lukas-moran/ai_learning" target="_blank" rel="noreferrer" aria-label="在 GitHub 查看项目">
          <i data-lucide="github" class="icon"></i>
          <span>lukas-moran/ai_learning</span>
        </a>

        <div class="menu-panel" id="menuPanel">
          <div class="menu-panel-label">知识目录</div>
          <div id="menuPanelLinks"></div>
        </div>
      </div>
    </div>

    <div class="category-nav-wrap">
      <nav class="category-nav" id="categoryNav" aria-label="知识分类"></nav>
    </div>
  </header>

  <main>
    <div class="breadcrumb" id="breadcrumb">
      <a href="#plan">首页</a>
      <span>/</span>
      <span id="breadcrumbCurrent">计划</span>
    </div>

    <div class="page-head">
      <div class="page-head-main">
        <h1 id="pageTitle">学习计划</h1>
        <p class="page-description" id="pageDescription">按阶段整理学习目标，逐项完成基础、模型理解与应用实践。</p>
      </div>
      <div class="page-meta">
        <strong id="pageMetaLabel">学习进度</strong>
        <span id="pageMetaText">0 / 4 已完成</span>
      </div>
    </div>

    <div id="content"></div>
    <noscript>这个目录需要启用 JavaScript 才能切换分类和搜索知识点。</noscript>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>AI 学习笔记 · 个人知识目录</span>
      <div class="footer-links">
        <a href="https://github.com/lukas-moran/ai_learning" target="_blank" rel="noreferrer">GitHub</a>
        <span id="footerYear">2026</span>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    (function () {
      "use strict";

      const categories = [
        {
          id: "plan",
          label: "计划",
          title: "学习计划",
          description: "按阶段整理学习目标，逐项完成基础、模型理解与应用实践。",
          type: "plan"
        },
        {
          id: "math",
          label: "数学基础",
          title: "数学基础",
          description: "理解机器学习与深度学习所需的线性代数、概率、微积分和信息论基础。",
          groups: [
            {
              title: "核心概念",
              items: [
                { title: "向量、矩阵与线性变换", description: "矩阵乘法、秩、特征值与奇异值分解的直觉。" },
                { title: "概率论与统计基础", description: "随机变量、常见分布、期望、方差与最大似然。" },
                { title: "微积分与梯度", description: "偏导数、链式法则、雅可比矩阵与梯度下降。" },
                { title: "信息论基础", description: "熵、交叉熵、KL 散度与最大熵原理。" }
              ]
            },
            {
              title: "实践补充",
              items: [
                { title: "数值稳定性", description: "Softmax、对数求和与溢出问题的处理方法。" },
                { title: "常用矩阵分解", description: "SVD、PCA 与低秩近似在模型中的应用。" }
              ]
            }
          ]
        },
        {
          id: "python",
          label: "Python 工程",
          title: "Python 工程",
          description: "记录 Python、NumPy、PyTorch 与实验管理相关的工程实践。",

      function renderIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons({ icons: window.lucide.icons });

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getCategory(id) {
        return categories.find(function (category) { return category.id === id; }) || categories[0];
      }

      function getPlanProgress() {
        try {
          const saved = JSON.parse(localStorage.getItem(planStorageKey) || "{}");
          return saved && typeof saved === "object" ? saved : {};
        } catch (error) {
          return {};
        }
      }

      function savePlanProgress(progress) {
        localStorage.setItem(planStorageKey, JSON.stringify(progress));
      }

      function buildNavigation() {
        categoryNav.innerHTML = categories.map(function (category) {
          return `<a class="category-link" href="#${category.id}" data-category="${category.id}">${escapeHtml(category.label)}</a>`;
        }).join("");

        menuPanelLinks.innerHTML = categories.map(function (category, index) {
          return `<a href="#${category.id}" data-menu-category="${category.id}">
            <span>${escapeHtml(category.label)}</span>
            <span>${String(index).padStart(2, "0")}</span>
          </a>`;
        }).join("");
      }

      function updateActiveNavigation() {
        document.querySelectorAll("[data-category]").forEach(function (link) {
          link.classList.toggle("is-active", link.dataset.category === activeCategory);
        });
        document.querySelectorAll("[data-menu-category]").forEach(function (link) {
          link.classList.toggle("is-active", link.dataset.menuCategory === activeCategory);
        });
      }

      function renderPlan() {
        const progress = getPlanProgress();
        const total = planGroups[0].items.length;
        const completed = planGroups[0].items.filter(function (item) { return Boolean(progress[item.id]); }).length;
        const percentage = total ? Math.round((completed / total) * 100) : 0;

        pageTitle.textContent = "学习计划";
        pageDescription.textContent = "按阶段整理学习目标，逐项完成基础、模型理解与应用实践。";
        pageMetaLabel.textContent = "学习进度";
        pageMetaText.textContent = completed + " / " + total + " 已完成";

        const planList = planGroups[0].items.map(function (item, index) {
          const isComplete = Boolean(progress[item.id]);
          return `<li>
            <label class="outline-row plan-row${isComplete ? " is-complete" : ""}">
              <input type="checkbox" data-plan-id="${escapeHtml(item.id)}"${isComplete ? " checked" : ""}>
              <span class="outline-index">${String(index + 1).padStart(2, "0")}</span>
              <span class="outline-main">
                <span class="outline-title">${escapeHtml(item.title)}</span>
                <span class="outline-description">${escapeHtml(item.description)}</span>
              </span>
              <span class="outline-meta">${escapeHtml(item.time)}</span>
            </label>
          </li>`;
        }).join("");

        const stages = planGroups[1].items.map(function (item) {
          return `<li>
            <a class="outline-row stage-row is-link" href="#${escapeHtml(item.target)}" data-open-category="${escapeHtml(item.target)}">
              <span class="outline-index">${escapeHtml(item.index)}</span>
              <span class="outline-main">
                <span class="outline-title">${escapeHtml(item.title)}</span>
                <span class="outline-description">${escapeHtml(item.description)}</span>
              </span>
              <span class="outline-meta"><i data-lucide="arrow-right" class="icon"></i></span>
            </a>
          </li>`;
        }).join("");

        content.innerHTML = `
          <div class="plan-progress">
            <div class="progress-copy">
              <span>当前进度</span>
              <strong>${percentage}%</strong>
            </div>
            <div class="progress-track" aria-hidden="true"><span style="width: ${percentage}%"></span></div>
          </div>
          <section class="content-section">
            <div class="section-heading">
              <h2>${escapeHtml(planGroups[0].title)}</h2>
              <span>${completed} / ${total} 已完成</span>
            </div>
            <ul class="outline-list">${planList}</ul>
          </section>
          <section class="content-section">
            <div class="section-heading">
              <h2>${escapeHtml(planGroups[1].title)}</h2>
              <span>4 个阶段</span>
            </div>
            <ul class="outline-list">${stages}</ul>
          </section>`;

        content.querySelectorAll(".plan-row input").forEach(function (checkbox) {
          checkbox.addEventListener("change", function () {
            const currentProgress = getPlanProgress();
            currentProgress[checkbox.dataset.planId] = checkbox.checked;
            savePlanProgress(currentProgress);
            renderPlan();
            renderIcons();
          });
        });
      }

      function renderCategory(category) {
        activeCategory = category.id;
        updateActiveNavigation();
        breadcrumbCurrent.textContent = category.label;
        pageTitle.textContent = category.title;
        pageDescription.textContent = category.description;
        pageMetaLabel.textContent = "内容条目";
        pageMetaText.textContent = category.groups.reduce(function (total, group) {
          return total + group.items.length;
        }, 0) + " 个知识点";

        const groupsHtml = category.groups.map(function (group) {
          const itemsHtml = group.items.map(function (item, index) {
            return `<li>
              <div class="outline-row">
                <span class="outline-index">${String(index + 1).padStart(2, "0")}</span>
                <span class="outline-main">
                  <span class="outline-title">${escapeHtml(item.title)}</span>
                  <span class="outline-description">${escapeHtml(item.description)}</span>
                </span>
                <span class="outline-meta"></span>
              </div>
            </li>`;

          return `<section class="content-section">
            <div class="section-heading">
              <h2>${escapeHtml(group.title)}</h2>
              <span>${group.items.length} 项</span>
            </div>
            <ul class="outline-list">${itemsHtml}</ul>
          </section>`;
        }).join("");

        content.innerHTML = groupsHtml;
      }

      function renderCategoryFromHash() {
        if (searchInput.value.trim()) return;
        const id = window.location.hash.replace(/^#/, "") || "plan";
        const category = getCategory(id);
        if (category.type === "plan") {
          activeCategory = "plan";
          updateActiveNavigation();
          breadcrumbCurrent.textContent = "计划";
          renderPlan();
        } else {
          renderCategory(category);
        }
        renderIcons();
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      function flattenItems() {
        const results = [];
        categories.forEach(function (category) {
          if (!category.groups) return;
          category.groups.forEach(function (group) {
            group.items.forEach(function (item) {
              results.push({
                categoryId: category.id,
                categoryLabel: category.label,
                groupTitle: group.title,
                item: item
              });
            });
          });
        });
        return results;
      }

      function renderSearch(query) {
        const normalized = query.trim().toLowerCase();
        lastQuery = normalized;
        breadcrumbCurrent.textContent = "搜索";
        pageTitle.textContent = "搜索";
        pageMetaLabel.textContent = "搜索关键词";
        pageMetaText.textContent = query.trim();

        if (!normalized) {
          renderCategoryFromHash();
          return;
        }

        document.querySelectorAll("[data-category]").forEach(function (link) {
          link.classList.remove("is-active");
        });

        const results = flattenItems().filter(function (result) {
          return [result.item.title, result.item.description, result.categoryLabel, result.groupTitle]
            .join(" ")
            .toLowerCase()
            .includes(normalized);
        });

        pageDescription.textContent = results.length
          ? "在所有知识分类中找到以下内容。"
          : "没有找到相关内容，请尝试更短的关键词。";
        pageMetaText.textContent = results.length + " 项结果";

        if (!results.length) {
          content.innerHTML = `<div class="empty-state"><strong>没有匹配的知识点</strong><span>试试搜索“Transformer”“RAG”或“数学”。</span></div>`;
          renderIcons();
          return;
        }

        const rows = results.map(function (result) {
          return `<button class="search-result-row" type="button" data-result-category="${result.categoryId}" data-result-title="${escapeHtml(result.item.title)}">
            <span class="outline-main">
              <span class="outline-title"><span class="search-result-category">${escapeHtml(result.categoryLabel)}</span>${escapeHtml(result.item.title)}</span>
              <span class="outline-description">${escapeHtml(result.item.description)}</span>
            </span>
            <i data-lucide="arrow-right" class="icon"></i>
          </button>`;
        }).join("");

        content.innerHTML = `<section class="content-section">
          <div class="section-heading"><h2>搜索结果</h2><span>${results.length} 项</span></div>
          <div>${rows}</div>
        </section>`;

        content.querySelectorAll("[data-result-category]").forEach(function (button) {
          button.addEventListener("click", function () {
            const categoryId = button.dataset.resultCategory;
            const targetTitle = button.dataset.resultTitle;
            searchInput.value = "";
            lastQuery = "";
            window.location.hash = categoryId;
            window.setTimeout(function () {
              const targetRow = Array.from(document.querySelectorAll(".outline-row")).find(function (row) {
                const title = row.querySelector(".outline-title");
                return title && title.textContent.trim() === targetTitle;
              });
              if (targetRow) {
                targetRow.classList.add("highlight-row");
                targetRow.scrollIntoView({ behavior: "smooth", block: "center" });
              }
            }, 80);
          });
        });
        renderIcons();
      }

      function closeMenu() {
        menuPanel.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开目录菜单");
      }

      menuButton.addEventListener("click", function () {
        const isOpen = menuPanel.classList.toggle("is-open");
        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute("aria-label", isOpen ? "关闭目录菜单" : "打开目录菜单");
      });

      document.addEventListener("click", function (event) {
        if (!menuPanel.contains(event.target) && !menuButton.contains(event.target)) {
          closeMenu();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          if (menuPanel.classList.contains("is-open")) {
            closeMenu();
            menuButton.focus();
          } else if (searchInput.value) {
            searchInput.value = "";
            renderCategoryFromHash();
          }
        }
        if (event.key === "/" && document.activeElement !== searchInput) {
          event.preventDefault();
          searchInput.focus();
        }
      });

      searchInput.addEventListener("input", function () {
        const query = searchInput.value;
        if (query.trim()) {
          renderSearch(query);
        } else {
          renderCategoryFromHash();
        }
      });

      menuPanelLinks.addEventListener("click", function (event) {
        const link = event.target.closest("[data-menu-category]");
        if (!link) return;
        closeMenu();
        searchInput.value = "";
      });

      categoryNav.addEventListener("click", function () {
        searchInput.value = "";
        closeMenu();
      });

      content.addEventListener("click", function (event) {
        const link = event.target.closest("[data-open-category]");
        if (!link) return;
        searchInput.value = "";
      });

      window.addEventListener("hashchange", function () {
        if (!searchInput.value.trim()) {
          renderCategoryFromHash();
        }
      });

      buildNavigation();
      document.getElementById("footerYear").textContent = String(new Date().getFullYear());
      renderIcons();
      renderCategoryFromHash();
    })();
  </script>
</body>
</html>
